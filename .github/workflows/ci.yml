name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check docs, generated proposal and tooling
        run: python -B scripts/check_repo.py
